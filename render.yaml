services:
  # --------------------------------------------------------------------------
  # 1. Sanjeevani AI Microservice (Python FastAPI)
  # --------------------------------------------------------------------------
  - type: web
    name: sanjeevani-ai
    env: python
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: ENV
        value: production

  # --------------------------------------------------------------------------
  # 2. Sanjeevani Core Backend (Node.js Express + Socket.IO)
  # --------------------------------------------------------------------------
  - type: web
    name: sanjeevani-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: sanjeevani-ai
          property: host
